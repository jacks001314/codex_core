name: Go

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go mod download
      - run: go list -buildvcs=false ./...
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./... -coverprofile=coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
